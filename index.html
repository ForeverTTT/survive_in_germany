
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>德区留子生存模拟器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: #0a0a0a;
            color: #e5e5e5;
            overflow-x: hidden;
        }
        .serif-font {
            font-family: 'Playfair Display', serif;
        }
        .cinematic-gradient {
            background: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.4) 60%, rgba(0,0,0,0.9) 100%),
                        linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.8) 100%);
        }
        .blur-in {
            animation: blurIn 1.5s ease-out forwards;
        }
        @keyframes blurIn {
            from { filter: blur(20px); opacity: 0; }
            to { filter: blur(0); opacity: 1; }
        }
        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translateY(-40px); opacity: 0; }
        }
        .animate-float-up {
            animation: floatUp 2s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .animate-fadeIn {
            animation: fadeIn 0.8s ease-out forwards;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .animate-shake {
            animation: shake 0.2s ease-in-out infinite;
        }
        @keyframes bounceIn {
            0% { transform: scale(0.8); opacity: 0; }
            70% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); }
        }
        .animate-bounce-in {
            animation: bounceIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}
    </style>
</head>
<body>
    <div id="root">
        <!-- 纯 HTML 加载指示器：如果 React 崩溃，至少能看到这个 -->
        <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 1rem;">
            <div style="width: 3rem; height: 3rem; border: 2px solid rgba(255,255,255,0.2); border-top-color: white; border-radius: 50%; animation: spin 1s linear infinite;"></div>
            <p style="color: rgba(255,255,255,0.8); font-size: 0.875rem; letter-spacing: 0.1em;">正在加载游戏...</p>
            <p style="color: rgba(255,255,255,0.4); font-size: 0.75rem; margin-top: 1rem;">如果长时间未响应，请按 F12 查看控制台错误</p>
        </div>
        <style>
            @keyframes spin {
                to { transform: rotate(360deg); }
            }
        </style>
    </div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
